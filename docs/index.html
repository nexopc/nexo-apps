<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXO Apps</title>
<meta name="description" content="Red de aplicaciones de NEXO PC — Excelencia digital, confianza real.">
<meta name="theme-color" content="#110D17">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<style>
  :root{
    --bg:#F5F2F8; --surface:#FFFFFF; --ink:#1D1527; --ink-2:#4E4460; --ink-3:#766B88;
    --line:#E0D7EB; --accent:#6A2BD4; --accent-soft:#ECE3FB; --orange:#E8650F;
    --good:#167F4E; --good-bg:#DDF2E6; --warn:#A86B00; --warn-bg:#FBEFD6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#110D17; --surface:#1C1625; --ink:#F3EEFA; --ink-2:#C9BEDA; --ink-3:#9A8FAD;
      --line:#2E2540; --accent:#A87BFF; --accent-soft:#2A1F40; --orange:#FF8A3D;
      --good:#5BD39A; --good-bg:#16382A; --warn:#F2B84B; --warn-bg:#3A2D12;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 32px)}
  main{max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  header img{width:52px;height:52px;border-radius:14px}
  h1{font-size:1.6rem;margin:0;letter-spacing:-.01em}
  .tag{color:var(--ink-3);margin:2px 0 0;font-size:.92rem}
  h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:28px 0 10px}
  .grid{display:grid;gap:12px}
  a.card,div.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:72px}
  a.card:active{transform:scale(.99)}
  .ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    font-size:1.5rem;background:var(--accent-soft)}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:1.05rem}
  .txt span{color:var(--ink-2);font-size:.9rem}
  .st{flex:none;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px}
  .ok{background:var(--good-bg);color:var(--good)}
  .soon{background:var(--warn-bg);color:var(--warn)}
  div.card{opacity:.75}
  footer{margin-top:32px;color:var(--ink-3);font-size:.85rem;text-align:center}
  footer strong{color:var(--orange)}
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/icon-192.png" alt="">
    <div>
      <h1>NEXO Apps</h1>
      <p class="tag">Excelencia digital, confianza real.</p>
    </div>
  </header>

  <h2>Disponibles</h2>
  <div class="grid">
    <a class="card" href="https://nexopc.github.io/nexo-finanzas/">
      <div class="ico">💰</div>
      <div class="txt"><b>NEXO Finanzas</b><span>Ingresos, gastos, ahorro y metas</span></div>
      <span class="st ok">Lista</span>
    </a>
    <a class="card" href="https://nexopc.github.io/nexo-finanzas/oro/">
      <div class="ico">🪙</div>
      <div class="txt"><b>Oro y préstamos</b><span>Control de compras, préstamos y cobros</span></div>
      <span class="st ok">Lista</span>
    </a>
  </div>

  <h2>En camino</h2>
  <div class="grid">
    <div class="card">
      <div class="ico">🏪</div>
      <div class="txt"><b>Catálogo Quibdó</b><span>Productos de tiendas locales y pedido por WhatsApp</span></div>
      <span class="st soon">Pronto</span>
    </div>
  </div>

  <footer>Hecho en Quibdó por <strong>NEXO PC</strong></footer>
</main>
</body>
</html>
